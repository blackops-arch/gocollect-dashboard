<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GoCollect · fleet ledger</title>
<style>
:root{
--pk-red:#ee1515;--pk-red2:#ff4d4d;--pk-yellow:#ffcb05;--pk-blue:#3b4cca;--pk-blue2:#6b7cff;
--ink:#0a0c10;--ink2:#12161d;--card:#12161d;--card2:#161b24;--line:#1e2530;
--fg:#dfe7f2;--dim:#7c8a9e;
--ok:#3ddc97;--warn:#f5c451;--bad:#ff5c7a;--acc:#38e8d0;--vio:#b06bff;
--common:#a8a878;--uncommon:#78c850;--rare:#6890f0;--grail:#f08030;
--bg:#0a0c10}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:
 radial-gradient(1100px 480px at 12% -8%,rgba(56,232,208,.10),transparent 62%),
 radial-gradient(1000px 460px at 92% 0%,rgba(61,220,151,.08),transparent 60%),
 radial-gradient(900px 600px at 50% 120%,rgba(56,232,208,.06),transparent 60%),
 var(--bg);
 background-attachment:fixed;color:var(--fg);min-height:100vh;
 font:14px/1.5 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.topbar{height:4px;background:linear-gradient(90deg,#38e8d0 0 33%,#3ddc97 33% 66%,#6b7cff 66% 100%)}
header{padding:13px 18px;border-bottom:1px solid var(--line);
 background:linear-gradient(180deg,rgba(18,22,29,.92),rgba(10,12,16,.86));
 backdrop-filter:blur(8px);display:flex;gap:13px;align-items:center;flex-wrap:wrap;
 position:sticky;top:0;z-index:20}
.pball{width:26px;height:26px;border-radius:50%;flex:0 0 auto;position:relative;
 border:2px solid #0b0c14;
 background:linear-gradient(180deg,var(--pk-red) 0 46%,#0b0c14 46% 54%,#fff 54% 100%);
 box-shadow:0 0 14px rgba(238,21,21,.55),0 0 0 2px rgba(255,255,255,.9) inset}
.pball:after{content:"";position:absolute;inset:0;margin:auto;width:9px;height:9px;
 border-radius:50%;background:#fff;border:2px solid #0b0c14}
h1{font-size:15.5px;margin:0;font-weight:800;letter-spacing:.2px;
 background:linear-gradient(90deg,#fff,#ffd9d9);-webkit-background-clip:text;background-clip:text}
.dim{color:var(--dim);font-size:12.5px}
main{padding:16px;max-width:1250px;margin:0 auto}
.tabs{display:flex;gap:6px;margin:0 0 14px;flex-wrap:wrap;align-items:center}
.wfilter{display:flex;gap:4px;align-items:center;margin-left:auto;flex-wrap:wrap}
.wfilter .tab{padding:4px 10px;font-size:12px}
.tab{padding:6px 13px;border:1px solid var(--line);border-radius:8px;background:rgba(18,22,29,.6);
color:var(--dim);cursor:pointer;font:inherit;font-size:13px;line-height:1.4;transition:.15s}
.tab:hover{border-color:var(--acc);color:var(--fg);transform:translateY(-1px)}
.tab.on{background:linear-gradient(180deg,var(--card2),var(--card));color:#fff;
 border-color:var(--acc);box-shadow:0 0 0 1px rgba(56,232,208,.30),0 4px 14px rgba(56,232,208,.25)}
.tab b{color:var(--fg);font-weight:700}
.wgrid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(240px,1fr))}
.wcard{background:linear-gradient(180deg,var(--card),#12161d);border:1px solid var(--line);
 border-radius:13px;padding:13px;cursor:pointer;transition:.16s;display:flex;flex-direction:column;
 gap:9px;position:relative;overflow:hidden}
.wcard:before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;
 background:linear-gradient(180deg,var(--pk-red),var(--pk-yellow))}
.wcard:hover{border-color:var(--acc);transform:translateY(-2px);
 box-shadow:0 10px 26px rgba(0,0,0,.42),0 0 0 1px rgba(107,124,255,.3)}
.wcard .top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.wname{font-family:ui-monospace,Menlo,monospace;font-weight:800;font-size:16px;
 background:linear-gradient(90deg,var(--pk-yellow),#fff);-webkit-background-clip:text;
 background-clip:text;color:transparent}
.waddr{font-family:ui-monospace,Menlo,monospace;font-size:11px;color:var(--dim)}
.mono{font-family:ui-monospace,Menlo,monospace;font-size:11px;overflow-wrap:anywhere}
.wbig{font-size:26px;font-weight:800;line-height:1;font-family:ui-monospace,Menlo,monospace;color:#fff}
.wbig span{font-size:11px;font-weight:500;color:var(--dim);font-family:inherit;margin-left:4px}
.split{display:flex;height:7px;border-radius:4px;overflow:hidden;background:#2a3168}
.split i{display:block;height:100%}
.si-ok{background:linear-gradient(90deg,#2fbf6f,var(--ok))}
.si-den{background:linear-gradient(90deg,#d9a900,var(--warn))}
.wpills{display:flex;gap:6px;flex-wrap:wrap}
.pill{font-size:10.5px;padding:2px 8px;border-radius:99px;border:1px solid var(--line);
color:var(--dim);white-space:nowrap;background:rgba(30,37,48,.5)}
.pill.ok{color:var(--ok);border-color:#2b7a4d}
.pill.den{color:var(--warn);border-color:#7a6510}
.pill.draw{color:var(--acc);border-color:#1d4a48}
.pill.eta{color:var(--acc);border-color:#1d4a48}
.pill.loc{color:#8fd3ff;border-color:#1d3a4a}
.pill.dev{color:#c0a8ff;border-color:#322a4a}
.wbar{height:10px;border-radius:5px;background:#1a2130;overflow:hidden}
.wbar i{display:block;height:100%;background:linear-gradient(90deg,#38e8d0,#3ddc97)}
.webar{display:flex;gap:6px;flex-wrap:wrap}
.wbig small{font-size:15px;font-weight:700;color:var(--dim);font-family:inherit;margin-left:1px}
.pill.zero{color:var(--ok);border-color:#2b7a4d}
.pill.bad{color:var(--bad);border-color:#7a2b2b}
.wfoot{display:flex;justify-content:space-between;align-items:center;gap:8px;
font-size:11px;color:var(--dim);margin-top:1px}
.minicards{display:flex;gap:6px;flex-wrap:wrap;margin-top:2px}
.minicard{display:flex;align-items:center;gap:6px;background:var(--card2);border:1px solid var(--line);
border-radius:8px;padding:3px 7px;font-size:10.5px;max-width:100%}
.minicard img{width:20px;height:20px;object-fit:cover;border-radius:4px;background:#2a3168}
.minicard span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:130px}
.kpis{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(105px,1fr));margin-bottom:14px}
.kpi{background:linear-gradient(180deg,var(--card),#12161d);border:1px solid var(--line);
 border-radius:11px;padding:10px 12px}
.kpi .v{font-size:20px;font-weight:800;line-height:1.2;font-family:ui-monospace,Menlo,monospace;color:#fff}
.kpi .l{font-size:10px;color:var(--dim);text-transform:uppercase;letter-spacing:.6px;margin-top:2px}
.card{background:linear-gradient(180deg,var(--card),#12161d);border:1px solid var(--line);
 border-radius:12px;overflow:hidden}
.tscroll{max-height:62vh;overflow:auto}
table{width:100%;border-collapse:collapse;font-size:12.5px}
thead th{text-align:left;color:var(--dim);font-weight:700;font-size:10.5px;text-transform:uppercase;
letter-spacing:.5px;padding:9px 8px;border-bottom:1px solid var(--line);cursor:pointer;white-space:nowrap;
position:sticky;top:0;background:var(--card);z-index:2}
thead th.sel{color:var(--pk-yellow)}
thead th .ar{opacity:.6;font-size:9px}
td{padding:7px 8px;border-bottom:1px solid #1e2450;font-family:ui-monospace,Menlo,monospace;
white-space:nowrap}
tbody tr{cursor:pointer}
tbody tr:hover{background:rgba(30,37,48,.6)}
.badge{font-size:11px;padding:2px 8px;border-radius:99px;border:1px solid;white-space:nowrap}
.b-server{color:var(--warn);border-color:#7a6510;background:rgba(255,203,5,.08)}
.b-client{color:var(--vio);border-color:#5a3a8a;background:rgba(176,107,255,.08)}
.st-approved{color:var(--ok);border-color:#2b7a4d;background:rgba(61,220,132,.08)}
.st-pending{color:var(--warn);border-color:#7a6510;background:rgba(255,203,5,.08)}
.st-denied{color:var(--bad);border-color:#7a2b2b;background:rgba(255,82,82,.08)}
.st-cashed{color:var(--acc);border-color:#1d4a48;background:rgba(107,124,255,.1)}
.t-common{color:var(--common)}.t-uncommon{color:var(--uncommon)}
.t-rare{color:var(--rare)}
.t-grail{color:var(--grail);font-weight:800;text-shadow:0 0 10px rgba(240,128,48,.55)}
.t-empty{color:var(--dim)}
.c-empty{color:var(--dim)}.c-out_of_range{color:var(--warn)}.c-suspicious_movement{color:var(--bad)}
.c-too_fast{color:var(--vio)}.c-net_error{color:var(--bad)}.c-already_opened{color:var(--dim)}
.s200{color:var(--ok)}.s4xx{color:var(--warn)}.s5xx{color:var(--bad)}.s0{color:var(--vio)}
.reasons{display:grid;gap:8px;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));margin-bottom:14px}
.rcard{background:linear-gradient(180deg,var(--card),#12161d);border:1px solid var(--line);
 border-radius:10px;padding:10px 12px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.rcard .n{font-family:ui-monospace,Menlo,monospace;font-size:18px;font-weight:800;color:var(--warn)}
.rcard .rn{font-size:12px;color:var(--dim)}
.back{background:rgba(18,22,29,.7);border:1px solid var(--line);color:var(--acc);
border-radius:8px;padding:5px 12px;cursor:pointer;font:inherit;font-size:13px;transition:.15s}
.back:hover{border-color:var(--acc);background:var(--card2)}
.whead{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.whead .nm{font-family:ui-monospace,Menlo,monospace;font-size:21px;font-weight:800;
 background:linear-gradient(90deg,var(--pk-yellow),#fff);-webkit-background-clip:text;
 background-clip:text;color:transparent}
h2{font-size:12px;color:var(--dim);text-transform:uppercase;letter-spacing:.7px;
margin:0 0 9px;font-weight:700}
.cgrid{display:grid;gap:11px;grid-template-columns:repeat(auto-fill,minmax(215px,1fr))}
.ccard{background:linear-gradient(180deg,var(--card),#12161d);border:1px solid var(--line);
 border-radius:12px;overflow:hidden;cursor:pointer;display:flex;flex-direction:column;transition:.16s}
.ccard:hover{border-color:var(--pk-yellow);transform:translateY(-2px);
 box-shadow:0 10px 26px rgba(0,0,0,.42)}
.ccard img{width:100%;aspect-ratio:1;object-fit:cover;background:#2a3168;display:block}
.cbody{padding:9px 10px;display:flex;flex-direction:column;gap:6px}
.cname{font-size:12px;line-height:1.35;height:2.7em;overflow:hidden}
#drawer{position:fixed;inset:0 0 0 auto;width:min(560px,100%);
 background:linear-gradient(180deg,#12161d,#0a0c10);border-left:1px solid var(--line);
 transform:translateX(102%);transition:transform .22s;overflow-y:auto;z-index:40;padding:16px 18px 60px}
#drawer.open{transform:none}
#scrim{position:fixed;inset:0;background:rgba(5,7,20,.68);opacity:0;pointer-events:none;
transition:opacity .2s;z-index:30}
#scrim.open{opacity:1;pointer-events:auto}
.dhead{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:6px}
.dhead h3{font-size:16px;margin:0;color:#fff}
.x{background:rgba(18,22,29,.8);border:1px solid var(--line);color:var(--dim);border-radius:7px;
padding:4px 10px;cursor:pointer;font:inherit}
.x:hover{border-color:var(--bad);color:var(--bad)}
dl{display:grid;grid-template-columns:132px 1fr;gap:7px 10px;margin:14px 0;font-size:13px}
dt{color:var(--dim);font-size:11px;text-transform:uppercase;letter-spacing:.4px;padding-top:2px}
dd{margin:0;font-family:ui-monospace,Menlo,monospace;word-break:break-all}
.note{background:rgba(30,37,48,.5);border:1px solid var(--line);border-left:3px solid var(--acc);
border-radius:8px;padding:9px 12px;font-size:12.5px;color:var(--dim);margin:12px 0}
details{margin:12px 0}
summary{cursor:pointer;color:var(--acc);font-size:12.5px}
pre{background:#0b0d11;border:1px solid var(--line);border-radius:9px;padding:11px;
overflow-x:auto;font-size:11.5px;margin:9px 0 0;color:#cdd3de}
.copy{background:rgba(18,22,29,.8);border:1px solid var(--line);color:var(--acc);border-radius:5px;
padding:1px 7px;cursor:pointer;font-size:11px;margin-left:6px}
.copy:hover{border-color:var(--acc)}
.cimg{width:100%;border-radius:10px;border:1px solid var(--line);margin-bottom:12px;display:block}
.empty{color:var(--dim);padding:22px;text-align:center}
footer{color:var(--dim);font-size:11px;padding:16px;border-top:1px solid var(--line);margin-top:22px}
.err{color:var(--bad)}
@media(max-width:620px){dl{grid-template-columns:1fr}dt{padding-top:8px}
 .kpis{grid-template-columns:repeat(auto-fit,minmax(92px,1fr))}}
</style>
</head>
<body>
<div class="topbar"></div>
<header>
  <span class="pball" aria-hidden="true"></span>
  <h1 id="title">GoCollect fleet ledger</h1>
  <span class="dim" id="hdr">–</span>
  <span class="dim" id="upd">–</span>
  <div class="wfilter" id="wins" role="group" aria-label="time window">
    <span class="dim">window</span>
    <button class="tab" data-w="1h">1h</button>
    <button class="tab" data-w="6h">6h</button>
    <button class="tab on" data-w="24h">24h</button>
    <button class="tab" data-w="all">all</button>
  </div>
</header>
<main>
  <div class="tabs" id="nav"></div>
  <div id="view"></div>
</main>
<div id="scrim"></div>
<aside id="drawer" aria-hidden="true"></aside>
<footer>Times shown in your local clock · reads UTC from the ledger · auto-refresh 8s · click a wallet or card for detail ·
the ledger stores the server's status/code, not its response body or message text</footer>
<script>
const RAW="https://raw.githubusercontent.com/blackops-arch/gocollect-dashboard/data/ledger.json";
const $=s=>document.querySelector(s);
const WIN_MS={"1h":3600e3,"6h":6*3600e3,"24h":24*3600e3,"all":Infinity};
const WINLABEL={"1h":"last hour","6h":"last 6h","24h":"last 24h","all":"all time"};
let DATA=null, WIN="24h", PAGE="wallets", PICK=null, SUB="denials", CSORT=["valueUsd",-1],
    OPEN=null, SORT={denials:["at",-1],opens:["at",-1],all:["at",-1]};

/* ---------- derived fields (per spec) ---------- */
const outcome=a=>a.status===200?"success":"denied";
const reason=a=>a.code?a.code:(a.status===0?"transport":"unknown");
const side=a=>a.status===0?"client":(a.status>=400?"server":"—");
const endpoint=a=>"POST /v1/crates/"+(a.crate_id||"")+"/open";
const message=a=>"HTTP "+a.status+" · POST /v1/crates/"+(a.crate_id||"")+"/open";
// Wallet numbers are 1-based everywhere (alerts say G6 for the wallet whose
// key file is C06). Printing the raw 0-based index made the panel disagree
// with both the key files and the card-watch alert.
// A wallet arrives either as a numeric index (attempts) or as a key-file
// label like "C08" (cards). Labels pass through unchanged; an index maps to
// its 1-based G-number. "G"+(+"C08"+1) was NaN, which printed GNaN.
const glabel=w=>{ const n=+w; return isNaN(n)?String(w):("G"+(n+1)); };
// Wallet label for the flat all-wallets tables. The ledger keys a row by wallet
// NUMBER (1..N) while the card view labels the same wallet "G<n>"; use the same
// spelling so a row and its card agree.
const walletName=w=>w==null?"—":glabel(w);
const shortCrate=id=>{const s=String(id==null?"":id);return s||"—";};
const wmeta=w=>(DATA&&DATA.wallets&&DATA.wallets[String(w)])||{};
const wLeft=w=>{const m=wmeta(w);return (m.limit!=null&&m.used!=null)?(m.limit-m.used):leftOf(w);};
const addr=w=>(DATA&&DATA.wallets&&DATA.wallets[String(w)]||{}).addr||"—";
// Remaining daily opens, from the server's own opensLeft for the wallet live now.
// Undefined for a wallet with no logged me-line yet.
const leftOf=w=>(DATA&&DATA.opens_left||{})[String(w)];
const totalLeft=()=>Object.values((DATA&&DATA.opens_left)||{}).reduce((s,n)=>s+Number(n||0),0);
const roll=u=>u==null?"—":Number(u).toFixed(5);
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
// The ledger stores UTC. Render in the viewer's own clock so a fresh row never
// reads as older than it is. Return the UTC slice when the stamp will not parse.
const LOC=(()=>{const d=new Date();return isNaN(d)?"":d.toLocaleTimeString("en-GB",{hour12:false}).slice(-6)+" "+d.toLocaleTimeString("en-GB",{timeZoneName:"short"}).split(" ").pop();})();
const _dt=at=>{const d=new Date(at);return isNaN(d)?null:d;};
const hhmmss=at=>{const d=_dt(at);return d?d.toLocaleTimeString("en-GB",{hour12:false}):(at||"").slice(11,19);};
const dayof=at=>{const d=_dt(at);return d?d.toLocaleDateString("en-CA"):(at||"").slice(0,10);};
const scls=s=>s===200?"s200":s===0?"s0":s>=500?"s5xx":"s4xx";
const money=v=>v==null?"—":"$"+Number(v).toLocaleString(undefined,{maximumFractionDigits:2});
function ago(at){
  if(!at) return "—";
  const s=Math.max(0,(Date.now()-Date.parse(at))/1000);
  if(s<60)return Math.floor(s)+"s ago";
  if(s<3600)return Math.floor(s/60)+"m ago";
  if(s<86400)return Math.floor(s/3600)+"h ago";
  return Math.floor(s/86400)+"d ago";
}
function winRows(){
  if(WIN==="all") return DATA.attempts;
  const cut=Date.now()-WIN_MS[WIN];
  return DATA.attempts.filter(a=>Date.parse(a.at)>=cut);
}
function walletIds(){
  const s=new Set(Object.keys(DATA.wallets||{}).map(Number));
  for(const a of DATA.attempts) s.add(a.wallet);
  return [...s].filter(n=>!isNaN(n)).sort((a,b)=>a-b);
}
function stats(list){
  const denied=list.filter(a=>outcome(a)==="denied");
  const acc=list.filter(a=>outcome(a)==="success");
  const draws=acc.filter(a=>a.tier&&a.tier!=="empty");
  return {n:list.length, denied:denied.length, acc:acc.length, draws:draws.length,
          tooFast:denied.filter(a=>reason(a)==="too_fast").length};
}
// Cards carry the key-file label ("C06"); the Wallet tab iterates numeric keys.
// Compare on one normalised form so both sides match.
const walletKey=w=>{ const k=(DATA.wallets||{})[w]; return (k&&k.label)||("C"+String(+w+1).padStart(2,"0")); };
function cardsOf(w){ const k=walletKey(w); return (DATA.cards||[]).filter(c=>c.wallet===k); }
function sameReasonToday(a){
  const d=dayof(a.at), r=reason(a);
  return DATA.attempts.filter(b=>dayof(b.at)===d && outcome(b)==="denied" && reason(b)===r).length;
}
function lastN(w,n){ return DATA.attempts.filter(a=>a.wallet===w).slice(-n).reverse(); }
const STCLASS={approved:"st-approved",pending:"st-pending",denied:"st-denied","cashed-out":"st-cashed"};

/* ---------- nav ---------- */
function nav(){
  const nC=(DATA.cards||[]).length, nD=(DATA.cards||[]).filter(c=>c.status==="denied").length;
  const items=[["wallets","Wallets",walletIds().length],["cards","Cards",nC],["attempts","Attempts",winRows().length]];
  $("#nav").innerHTML=items.map(([k,l,n])=>
    '<button class="tab'+(PAGE===k&&PICK==null?" on":"")+'" data-p="'+k+'">'+l
    +' <b>'+n+'</b>'+(k==="cards"&&nD?' <span class="pill bad">'+nD+' denied</span>':'')+'</button>').join("");
  document.querySelectorAll("#nav .tab").forEach(t=>t.onclick=()=>{
    PAGE=t.dataset.p; PICK=null; OPEN=null; render();
  });
}

/* ---------- view: wallet cards ---------- */
function cardsView(){
  const A=winRows(), ids=walletIds(), t=stats(A);
  $("#title").textContent="GoCollect fleet ledger";
  $("#hdr").textContent=WINLABEL[WIN]+" · "+ids.length+" wallets · "+A.length+" attempts · "+
    (A.length?dayof(A[0].at)+" → "+dayof(A[A.length-1].at):"no attempts");
  const tfCol=t.tooFast===0?"var(--ok)":"var(--warn)";
  const nCards=(DATA.cards||[]).length, nVal=(DATA.cards||[]).reduce((s,c)=>s+(c.valueUsd||0),0);
  const nLeft=totalLeft(), nLeftW=Object.keys((DATA&&DATA.opens_left)||{}).length;
  const leftCol=nLeft===0?"var(--dim)":"var(--ok)";
  const kpis='<div class="kpis">'
    +'<div class="kpi"><div class="v">'+t.n+'</div><div class="l">attempts</div></div>'
    +'<div class="kpi"><div class="v">'+t.acc+'</div><div class="l">accepted</div></div>'
    +'<div class="kpi"><div class="v">'+t.denied+'</div><div class="l">denied</div></div>'
    +'<div class="kpi"><div class="v" style="color:'+leftCol+'">'+nLeft+'</div><div class="l">opens left</div></div>'
    +'<div class="kpi"><div class="v">'+nCards+'</div><div class="l">cards</div></div>'
    +'<div class="kpi"><div class="v">'+money(nVal)+'</div><div class="l">cards value</div></div>'
    +'<div class="kpi"><div class="v" style="color:'+tfCol+'">'+t.tooFast+'</div><div class="l">too_fast</div></div>'
    +'</div>';
  const cards=ids.map(w=>{
    const mine=A.filter(a=>a.wallet===w), s=stats(mine);
    const myC=cardsOf(w);
    const okPct=s.n?100*s.acc/s.n:0, denPct=s.n?100-s.acc/s.n*100:0;
    const last=mine.length?mine[mine.length-1].at:null;
    const tf=s.tooFast===0?'<span class="pill zero">too_fast 0</span>'
                          :'<span class="pill den">too_fast '+s.tooFast+'</span>';
    const lf=leftOf(w);
    const lp=lf==null?'<span class="pill">left —</span>'
                      :'<span class="pill'+(lf?'':' zero')+'">left '+lf+'</span>';
    const mini=myC.length?myC.slice(0,3).map(c=>
      '<div class="minicard">'+(c.image?'<img src="'+esc(c.image)+'" loading="lazy" alt="">':'')
      +'<span class="t-'+esc(c.tier||"empty")+'">'+esc(c.name||c.tier||"card")+'</span></div>').join("")
      +(myC.length>3?'<div class="minicard"><span class="dim">+'+(myC.length-3)+' more</span></div>':"")
      :'';
    return '<div class="wcard" data-w="'+w+'">'
      +'<div class="top"><span class="wname">'+glabel(w)+'</span>'
      +'<span class="waddr">'+esc(addr(w))+'</span></div>'
      +'<div class="wbig">'+wmeta(w).used+'<small>/'+wmeta(w).limit+'</small><span>crates opened</span></div>'
      +'<div class="wbar"><i style="width:'+(wmeta(w).limit?Math.min(100,100*wmeta(w).used/wmeta(w).limit):0)+'%"></i></div>'
      +'<div class="webar"><span class="pill eta">'+(function(){
          const m=wmeta(w); if(m.eta_min===0) return 'done';
          if(m.eta_min==null) return 'ETA —';
          const t=m.eta_min<90?m.eta_min+'m':(m.eta_min/60).toFixed(1)+'h';
          return '⏱ '+t+' left';})()+'</span>'
      +'<span class="pill loc">📍 '+(wmeta(w).loc||'—')+'</span>'
      +'<span class="pill dev">📱 '+(wmeta(w).device||'—')+'</span></div>'
      +'<div class="split"><i class="si-ok" style="width:'+okPct+'%"></i>'
      +'<i class="si-den" style="width:'+denPct+'%"></i></div>'
      +'<div class="wpills"><span class="pill ok">accepted '+s.acc+'</span>'
      +'<span class="pill den">denied '+s.denied+'</span>'
      +'<span class="pill'+(myC.length?' draw':'')+'">cards '+myC.length+'</span>'
      +lp+tf+'</div>'
      +(mini?'<div class="minicards">'+mini+'</div>':'')
      +'<div class="wfoot"><span>'+ago(last)+'</span><span class="dim">view →</span></div>'
      +'</div>';
  }).join("");
  $("#view").innerHTML=kpis+'<div class="wgrid">'+cards+'</div>';
  document.querySelectorAll(".wcard").forEach(c=>c.onclick=()=>{
    PICK=+c.dataset.w; OPEN=null; SUB="denials"; render();
  });
}

/* ---------- view: all cards ---------- */
function cardsPage(){
  let cs=(DATA.cards||[]).slice();
  const byT={}; cs.forEach(c=>{const k=c.tier||"—"; byT[k]=(byT[k]||0)+1;});
  const byS={}; cs.forEach(c=>{byS[c.status]=(byS[c.status]||0)+1;});
  const [k,dir]=CSORT;
  cs.sort((a,b)=>{
    let x,y;
    if(k==="wallet"){x=a.wallet;y=b.wallet;}
    else if(k==="tier"){x=a.tier||"";y=b.tier||"";}
    else if(k==="status"){x=a.status||"";y=b.status||"";}
    else if(k==="valueUsd"){x=a.valueUsd==null?-1:a.valueUsd;y=b.valueUsd==null?-1:b.valueUsd;}
    else if(k==="day"){x=a.day||"";y=b.day||"";}
    else if(k==="name"){x=a.name||"";y=b.name||"";}
    if(x<y)return -dir; if(x>y)return dir; return 0;
  });
  $("#title").textContent="Cards";
  $("#hdr").textContent=cs.length+" card(s) · "+money(cs.reduce((s,c)=>s+(c.valueUsd||0),0))+" total";
  const tierPills=Object.entries(byT).sort((a,b)=>b[1]-a[1]).map(([t,n])=>
    '<div class="kpi"><div class="v t-'+esc(t)+'">'+n+'</div><div class="l">'+esc(t)+'</div></div>').join("");
  const stPills=["approved","pending","denied","cashed-out"].map(s=>
    '<div class="kpi"><div class="v '+(STCLASS[s]||"")+'" style="font-size:15px">'+(byS[s]||0)
    +'</div><div class="l">'+s+'</div></div>').join("");
  const cols=[["wallet","wallet"],["status","status"],["tier","rarity"],["name","card"],
              ["grade","grade"],["valueUsd","value"],["day","pulled"]];
  const thead=cols.map(([f,l])=>'<th data-f="'+f+'" class="'+(f===k?"sel":"")+'">'+l
    +(f===k?' <span class="ar">'+(dir<0?"▼":"▲")+'</span>':'')+'</th>').join("");
  const body=cs.length?cs.map((c,i)=>
    '<tr data-c="'+i+'"><td class="mono">'+esc(c.addr||c.wallet)+'</td>'
    +'<td><span class="badge '+(STCLASS[c.status]||"")+'">'+esc(c.status)+'</span></td>'
    +'<td class="t-'+esc(c.tier||"empty")+'">'+esc(c.tier||"—")+'</td>'
    +'<td>'+esc(c.name||"—")+'</td><td>'+esc(c.grade||"—")+'</td>'
    +'<td>'+money(c.valueUsd)+'</td><td>'+esc(c.day||"—")+'</td></tr>').join("")
    :'<tr><td colspan="7" class="empty">no cards yet</td></tr>';
  $("#view").innerHTML=
    '<div class="kpis">'+stPills+'</div>'
    +'<h2>by rarity</h2><div class="kpis">'+tierPills+'</div>'
    +'<div class="card"><div class="tscroll"><table><thead><tr>'+thead+'</tr></thead>'
    +'<tbody>'+body+'</tbody></table></div></div>'
    +'<div class="note">Status: <b>approved</b> = pulled and still in the wallet · '
    +'<b>pending</b> = the server is holding it · <b>denied</b> = the server refused the prize · '
    +'<b>cashed-out</b> = already redeemed. Card names, grades and values come from each '
    +'wallet\'s public profile.</div>';
  document.querySelectorAll("thead th").forEach(th=>th.onclick=()=>{
    const f=th.dataset.f;
    CSORT=[f,(CSORT[0]===f?-CSORT[1]:(f==="valueUsd"?-1:1))];
    render();
  });
  document.querySelectorAll("tbody tr[data-c]").forEach(tr=>
    tr.onclick=()=>cardDetail(cs[+tr.dataset.c]));
}

/* ---------- view: one wallet ---------- */
function walletView(){
  const w=PICK, A=winRows().filter(a=>a.wallet===w), s=stats(A), myC=cardsOf(w);
  $("#title").textContent=glabel(w);
  $("#hdr").textContent=WINLABEL[WIN]+" · "+s.n+" attempts · "+myC.length+" card(s)";
  const tfCol=s.tooFast===0?"var(--ok)":"var(--warn)";
  const wLeft=leftOf(w);
  const leftCol=wLeft==null?"var(--dim)":(wLeft?"var(--ok)":"var(--bad)");
  let sub=A.slice();
  if(SUB==="denials") sub=sub.filter(a=>outcome(a)==="denied");
  // Opens = every open attempt, newest first. Filtering on a.tier only ever
  // matched a WIN, so this tab sat empty at 0 cards while the wallet was opening
  // steadily. Show empties and refusals too, with their result code.
  if(SUB==="opens")   sub=sub.filter(a=>a.code!=="denied");
  const [k,dir]=SORT[SUB];
  sub.sort((a,b)=>{
    let x,y;
    if(k==="at"){x=a.at||"";y=b.at||"";}
    else if(k==="status"){x=a.status;y=b.status;}
    else if(k==="reason"){x=reason(a);y=reason(b);}
    else if(k==="side"){x=side(a);y=side(b);}
    else if(k==="tier"){x=a.tier||"";y=b.tier||"";}
    else if(k==="u"){x=a.u==null?-1:a.u;y=b.u==null?-1:b.u;}
    else if(k==="open_id"){x=a.open_id==null?-1:a.open_id;y=b.open_id==null?-1:b.open_id;}
    if(x<y)return -dir; if(x>y)return dir; return 0;
  });
  const COLSN={denials:[["at","time"],["status","status"],["reason","reason"],["side","side"],["message","message"]],
               opens:[["at","time"],["wallet","wallet"],["code","result"],["status","status"],["pity","pity"],["d","dist"],["crate_id","crate"],["u","roll"]],
               all:[["at","time"],["wallet","wallet"],["code","result"],["status","status"],["reason","reason"],["side","side"],["tier","tier"],["u","roll"]]};
  const thead=COLSN[SUB].map(([f,l])=>
    '<th data-f="'+f+'" class="'+(f===k?"sel":"")+'">'+l
    +(f===k?' <span class="ar">'+(dir<0?"▼":"▲")+'</span>':'')+'</th>').join("");
  const body=sub.length?sub.map(a=>{
    const i=DATA.attempts.indexOf(a), out=outcome(a);
    if(SUB==="denials") return '<tr data-i="'+i+'"><td>'+hhmmss(a.at)+'</td><td class="'+scls(a.status)+'">'
      +a.status+'</td><td><span class="badge b-'+side(a)+'">'+esc(reason(a))+'</span></td><td>'+side(a)
      +'</td><td>'+esc(message(a))+'</td></tr>';
    if(SUB==="opens") return '<tr data-i="'+i+'"><td>'+hhmmss(a.at)+'</td><td>'+esc(walletName(a.wallet))
      +'</td><td class="c-'+esc(a.code||"unknown")+'">'+esc(a.code||"?")+'</td><td class="'+scls(a.status)
      +'">'+(a.status==null?"—":a.status)+'</td><td>'+(a.pity==null?"—":a.pity)+'</td><td>'
      +(a.d==null?"—":Math.round(a.d)+'m')+'</td><td class="dim">'+esc(shortCrate(a.crate_id))
      +'</td><td>'+roll(a.u)+'</td></tr>';
    return '<tr data-i="'+i+'"><td>'+hhmmss(a.at)+'</td><td class="'+scls(a.status)+'">'+a.status+'</td><td>'
      +(out==="denied"?'<span class="badge b-'+side(a)+'">'+esc(reason(a))+'</span>':'—')+'</td><td>'
      +(out==="denied"?side(a):"—")+'</td><td class="t-'+esc(a.tier||"empty")+'">'+esc(a.tier||"—")
      +'</td><td>'+roll(a.u)+'</td></tr>';
  }).join(""):'<tr><td colspan="6" class="empty">nothing in this window</td></tr>';

  const byR={}; A.filter(a=>outcome(a)==="denied").forEach(a=>{const r=reason(a);byR[r]=(byR[r]||0)+1;});
  const rcards=Object.entries(byR).sort((a,b)=>b[1]-a[1]).map(([r,n])=>
    '<div class="rcard"><span class="rn">'+esc(r)+'</span><span class="n">'+n+'</span></div>').join("")
    ||'<div class="rcard"><span class="rn">no denials in this window</span><span class="n">0</span></div>';

  const cgrid=myC.length?myC.map((c,i)=>
    '<div class="ccard" data-ci="'+i+'">'+(c.image?'<img src="'+esc(c.image)+'" loading="lazy" alt="">':'')
    +'<div class="cbody"><div class="cname">'+esc(c.name||"—")+'</div>'
    +'<div class="wpills"><span class="badge '+(STCLASS[c.status]||"")+'">'+esc(c.status)+'</span>'
    +'<span class="pill t-'+esc(c.tier||"empty")+'">'+esc(c.tier||"—")+'</span>'
    +'<span class="pill draw">'+money(c.valueUsd)+'</span></div></div></div>').join("")
    :'<div class="empty">no cards pulled yet</div>';

  $("#view").innerHTML=
    '<div class="whead"><button class="back" id="back">← all wallets</button>'
    +'<span class="nm">'+glabel(w)+'</span><span class="waddr">'+esc(addr(w))+'</span></div>'
    +'<div class="kpis">'
    +'<div class="kpi"><div class="v">'+s.n+'</div><div class="l">attempts</div></div>'
    +'<div class="kpi"><div class="v">'+s.acc+'</div><div class="l">accepted</div></div>'
    +'<div class="kpi"><div class="v">'+s.denied+'</div><div class="l">denied</div></div>'
    +'<div class="kpi"><div class="v">'+myC.length+'</div><div class="l">cards</div></div>'
    +'<div class="kpi"><div class="v" style="color:'+leftCol+'">'+(wLeft==null?"—":wLeft)+'</div><div class="l">opens left</div></div>'
    +'<div class="kpi"><div class="v" style="color:'+tfCol+'">'+s.tooFast+'</div><div class="l">too_fast</div></div>'
    +'</div>'
    +'<h2>cards pulled</h2><div class="cgrid">'+cgrid+'</div>'
    +'<h2 style="margin-top:18px">denials by reason</h2><div class="reasons">'+rcards+'</div>'
    +'<div class="tabs">'
    +'<button class="tab'+(SUB==="denials"?" on":"")+'" data-s="denials">Denials</button>'
    +'<button class="tab'+(SUB==="opens"?" on":"")+'" data-s="opens">Opens</button>'
    +'<button class="tab'+(SUB==="all"?" on":"")+'" data-s="all">All</button>'
    +'</div>'
    +'<div class="card"><div class="tscroll"><table><thead><tr>'+thead+'</tr></thead>'
    +'<tbody>'+body+'</tbody></table></div></div>';

  $("#back").onclick=()=>{PICK=null;OPEN=null;render();};
  document.querySelectorAll(".tab[data-s]").forEach(t=>t.onclick=()=>{SUB=t.dataset.s;render();});
  document.querySelectorAll("thead th").forEach(th=>th.onclick=()=>{
    const f=th.dataset.f;
    SORT[SUB]=[f,(SORT[SUB][0]===f?-SORT[SUB][1]:(f==="at"?-1:1))];
    render();
  });
  document.querySelectorAll("tbody tr[data-i]").forEach(tr=>
    tr.onclick=()=>detail(DATA.attempts[+tr.dataset.i]));
  document.querySelectorAll(".ccard[data-ci]").forEach(c=>
    c.onclick=e=>{e.stopPropagation();cardDetail(myC[+c.dataset.ci]);});
}

/* ---------- view: flat attempts ---------- */
function attemptsPage(){
  const A=winRows().slice().sort((a,b)=>(b.at||"")<(a.at||"")?-1:1);
  $("#title").textContent="All attempts";
  $("#hdr").textContent=WINLABEL[WIN]+" · "+A.length+" attempts";
  const body=A.slice(0,600).map(a=>{
    const i=DATA.attempts.indexOf(a), out=outcome(a);
    return '<tr data-i="'+i+'"><td>'+hhmmss(a.at)+'</td><td>'+glabel(a.wallet)+'</td>'
      +'<td class="'+scls(a.status)+'">'+a.status+'</td><td class="c-'+esc(a.code||"unknown")
      +'">'+esc(a.code||"?")+'</td><td>'+(a.d==null?"—":Math.round(a.d)+'m')+'</td><td>'
      +(a.pity==null?"—":a.pity)+'</td></tr>';
  }).join("")||'<tr><td colspan="6" class="empty">nothing in this window</td></tr>';
  $("#view").innerHTML='<div class="card"><div class="tscroll"><table><thead><tr>'
    +'<th>time</th><th>wallet</th><th>status</th><th>result</th><th>dist</th><th>pity</th>'
    +'</tr></thead><tbody>'+body+'</tbody></table></div></div>';
  document.querySelectorAll("tbody tr[data-i]").forEach(tr=>
    tr.onclick=()=>detail(DATA.attempts[+tr.dataset.i]));
}

/* ---------- card detail ---------- */
function cardDetail(c){
  if(!c) return;
  $("#drawer").innerHTML=
    '<div class="dhead"><h3>'+esc(c.name||"Card")+'</h3>'
    +'<button class="x" id="xclose">close</button></div>'
    +(c.image?'<img class="cimg" src="'+esc(c.image)+'" alt="">':'')
    +'<span class="badge '+(STCLASS[c.status]||"")+'">'+esc(c.status)+'</span> '
    +'<span class="pill t-'+esc(c.tier||"empty")+'">'+esc(c.tier||"—")+'</span>'
    +'<dl>'
    +'<dt>Wallet</dt><dd>'+glabel(c.wallet)+' · '+esc(addr(c.wallet))+'</dd>'
    +'<dt>Rarity</dt><dd>'+esc(c.tier||"—")+'</dd>'
    +'<dt>Status</dt><dd>'+esc(c.status)+'</dd>'
    +'<dt>Grade</dt><dd>'+esc(c.grade||"—")+'</dd>'
    +'<dt>Value</dt><dd>'+money(c.valueUsd)+'</dd>'
    +'<dt>Pulled</dt><dd>'+esc(c.day||"—")+'</dd>'
    +'<dt>Times</dt><dd>'+(c.times==null?"—":c.times)+'</dd>'
    +'<dt>Sold for</dt><dd>'+money(c.soldUsd)+'</dd>'
    +'<dt>Mint</dt><dd>'+esc(c.mint||"—")
      +(c.mint?'<button class="copy" data-c="'+esc(c.mint)+'">copy</button>':'')+'</dd>'
    +'</dl>'
    +'<details><summary>Raw card record</summary><pre>'+esc(JSON.stringify(c,null,2))+'</pre></details>';
  $("#drawer").classList.add("open"); $("#drawer").setAttribute("aria-hidden","false");
  $("#scrim").classList.add("open");
  $("#xclose").onclick=closeDetail;
  $("#drawer").querySelectorAll(".copy").forEach(b=>b.onclick=()=>{
    navigator.clipboard&&navigator.clipboard.writeText(b.dataset.c);
    b.textContent="copied"; setTimeout(()=>b.textContent="copy",1200);
  });
}

/* ---------- attempt detail (drawer) ---------- */
function detail(a){
  if(!a) return;
  OPEN=a.at+"|"+a.wallet+"|"+a.crate_id;
  const out=outcome(a), r=reason(a), s=side(a);
  const rows10=lastN(a.wallet,10).map(b=>
    '<tr><td>'+hhmmss(b.at)+'</td><td class="'+scls(b.status)+'">'+b.status
    +'</td><td class="t-'+esc(b.tier||"empty")+'">'+esc(b.tier||"—")+'</td><td>'
    +esc(b.code||"—")+'</td></tr>').join("");
  $("#drawer").innerHTML=
    '<div class="dhead"><h3>'+(out==="denied"?"Denied · "+esc(r):"Accepted · "+esc(a.tier||""))+'</h3>'
    +'<button class="x" id="xclose">close</button></div>'
    +'<span class="badge b-'+s+'">'+s+'-side</span>'
    +'<dl>'
    +'<dt>Timestamp (UTC)</dt><dd>'+esc(a.at)+'</dd>'
    +'<dt>Wallet</dt><dd>'+glabel(a.wallet)+' · '+esc(addr(a.wallet))
      +'<button class="copy" data-c="'+esc(addr(a.wallet))+'">copy</button></dd>'
    +'<dt>Reason code</dt><dd>'+esc(r)+'</dd>'
    +'<dt>HTTP status</dt><dd>'+a.status+(a.status===0?' <span class="dim">(client-side)</span>':'')+'</dd>'
    +'<dt>Endpoint</dt><dd>'+esc(endpoint(a))+'</dd>'
    +'<dt>Crate</dt><dd>'+esc(a.crate_id)+'</dd>'
    +'<dt>Distance</dt><dd>'+(a.d==null?"—":a.d+" m")+'</dd>'
    +'<dt>Same reason today</dt><dd>'+sameReasonToday(a)+'×</dd>'
    +'<dt>Pity</dt><dd>'+(a.pity==null?"—":a.pity)+'</dd>'
    +'<dt>Roll u</dt><dd>'+roll(a.u)+'</dd>'
    +'</dl>'
    +'<div class="note">The ledger records the server\'s error code, not its response body or '
    +'message text — <code>farm_loop</code> never stored them. The raw record below is everything '
    +'that exists for this attempt.</div>'
    +'<details><summary>Raw ledger record</summary><pre>'+esc(JSON.stringify(a,null,2))+'</pre></details>'
    +'<h2 style="margin-top:18px">Last 10 attempts on this wallet</h2>'
    +'<div class="card"><table><thead><tr><th>time</th><th>status</th><th>tier</th><th>code</th></tr></thead>'
    +'<tbody>'+rows10+'</tbody></table></div>';
  $("#drawer").classList.add("open"); $("#drawer").setAttribute("aria-hidden","false");
  $("#scrim").classList.add("open");
  $("#xclose").onclick=closeDetail;
  $("#drawer").querySelectorAll(".copy").forEach(b=>b.onclick=()=>{
    navigator.clipboard&&navigator.clipboard.writeText(b.dataset.c);
    b.textContent="copied"; setTimeout(()=>b.textContent="copy",1200);
  });
}
function closeDetail(){OPEN=null;$("#drawer").classList.remove("open");
  $("#drawer").setAttribute("aria-hidden","true");$("#scrim").classList.remove("open");}
$("#scrim").onclick=closeDetail;
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeDetail();});

/* ---------- chrome ---------- */
function render(){
  if(!DATA) return;
  document.querySelectorAll("#wins .tab").forEach(t=>t.classList.toggle("on",t.dataset.w===WIN));
  // The window filter only applies to Wallets / wallet detail / Attempts.
  // On the Cards tab it would be a control that does nothing -- hide it.
  const wf=$("#wins");
  if(wf) wf.style.display=(PAGE==="cards"&&PICK==null)?"none":"";
  nav();
  if(PICK!=null) walletView();
  else if(PAGE==="cards") cardsPage();
  else if(PAGE==="attempts") attemptsPage();
  else cardsView();
  if(OPEN){
    const [at,w,c]=OPEN.split("|");
    const a=DATA.attempts.find(x=>x.at===at&&String(x.wallet)===w&&x.crate_id===c);
    if(a) detail(a);
  }
}
document.querySelectorAll("#wins .tab").forEach(t=>t.onclick=()=>{WIN=t.dataset.w;render();});
$("#upd").textContent="loading…";
async function tick(){
  try{
    const r=await fetch(RAW+"?t="+Date.now(),{cache:"no-store"});
    DATA=await r.json();
    $("#upd").textContent="updated "+new Date().toLocaleTimeString();
    render();
  }catch(e){$("#upd").innerHTML='<span class="err">feed unreachable</span>';}
}
tick();setInterval(tick,8000);
</script>
</body>
</html>
